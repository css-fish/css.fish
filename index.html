  <style type="text/css">
    @import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@200;300&display=swap');

    /* Config */
    /* Pauls awesome mixin */
    /* Styles */
    html,
    body {
      height: 100%;
      font-family: 'Oxanium', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(1rem, 4vw, 3rem);
      overflow: hidden;
    }

    h1,
    p {
      transition: color 250ms;
      line-height: 1rem;
      text-wrap: balance;
    }

    h1:hover,
    p:hover {
      color: rgba(255, 255, 255, 0.7);
    }

    .page-bg,
    .animation-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
    }

    .page-bg {
      /* background: $color-bg url("https://images.unsplash.com/photo-1562729562-679ab5311bbf?dpr=1&auto=format&fit=crop&w=1920&h=1080&q=100&cs=tinysrgb&crop=") no-repeat top center;
  background-size: cover; */
      background: linear-gradient(#101925, #1f3949);
      z-index: -1;
    }
    
    .page-wrapper {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      z-index: 2;
    }

    .page-wrapper h1 {
      color: rgba(255, 255, 255, 0.7);
    }

    .page-wrapper p {
      color: rgba(255, 255, 255, 0.4);
      font-style: italic;
    }

    .page-wrapper p span {
      font-weight: bold;
    }

    .particle {
      --fw: max(2560px, 100dvw);
      --fh: max(2560px, 100dvh);
      --star: random(0px, var(--fw), 1px) random(0px, var(--fh), 1px) #fff;
      --stars10: var(--star), var(--star), var(--star), var(--star), var(--star), var(--star), var(--star), var(--star), var(--star), var(--star);
      --stars100: var(--stars10), var(--stars10), var(--stars10), var(--stars10), var(--stars10), var(--stars10), var(--stars10), var(--stars10), var(--stars10), var(--stars10);
    }

    .particle::after {
      position: absolute;
      content: "";
      top: var(--fh);
      width: inherit;
      height: inherit;
      box-shadow: inherit;
    }

    .particle-1 {
      width: 1px;
      height: 1px;
      box-shadow: var(--stars100), var(--stars100), var(--stars100), var(--stars100), var(--stars100), var(--stars100);
      @media (prefers-reduced-motion: no-preference) {
        animation: animParticle 60s linear infinite;
      }
    }

    .particle-2 {
      width: 2px;
      height: 2px;
      box-shadow: var(--stars100), var(--stars100);
      @media (prefers-reduced-motion: no-preference) {
        animation: animParticle 120s linear infinite;
      }
    }

    .particle-3 {
      width: 3px;
      height: 3px;
      box-shadow: var(--stars100);
      @media (prefers-reduced-motion: no-preference) {
        animation: animParticle 180s linear infinite;
      }
    }

    .particle-4 {
      width: 1px;
      height: 1px;
      box-shadow: var(--stars100), var(--stars100), var(--stars100), var(--stars100);
      @media (prefers-reduced-motion: no-preference) {
        animation: animParticle 600s linear infinite;
      }
    }

    @keyframes animParticle {
      to {
        translate: 0 calc(-1 * var(--fh));
      }
    }
  </style>

<body>
  <!-- PARTICLE SYSTEM -->
  <div class="page-bg"></div>

  <div class="animation-wrapper">
    <div class="particle particle-1"></div>
    <div class="particle particle-2"></div>
    <div class="particle particle-3"></div>
    <div class="particle particle-4"></div>
  </div>

  <div class="page-wrapper">
    <h1>CSS.Fish</h1>
    <p>Let the <span>CSS</span> renaissance begin</p>
    <small><small>Coming soon to a browser near you</small></small>
  </div>
</body>
